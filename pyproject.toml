[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip-studio"
version = "0.2.1"
description = "Local-first desktop YouTube and video clipper with heatmaps, AI, captions and smart crop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "yt-dlp[default]>=2025.11.12",
  "requests>=2.31",
  "pysubs2>=1.7",
  "psutil>=5.9",
  "keyring>=25",
  ]

[project.optional-dependencies]
local-asr = ["faster-whisper>=1.1"]
vision = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8", "ruff>=0.8", "pyinstaller>=6"]

[project.scripts]
autoclip-studio = "autoclip_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
